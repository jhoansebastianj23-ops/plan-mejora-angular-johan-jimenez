<div class="login">
  <div class="login__card">
    <h2 class="login__title">Iniciar sesión</h2>
    <p class="login__subtitle">Ingresa con tu usuario y contraseña.</p>

    <div class="message message--error" *ngIf="message">
      {{ message }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="login__group">
        <label for="username">Usuario</label>

        <input formControlName="username" id="username" type="text" placeholder="Ingresa tu usuario" />

        <small class="error" *ngIf="isInvalid('username', 'required')">
          El usuario es obligatorio.
        </small>
      </div>

      <div class="login__group">
        <label for="password">Contraseña</label>

        <input formControlName="password" id="password" type="password" placeholder="••••••" />

        <small class="error" *ngIf="isInvalid('password', 'required')">
          La contraseña es obligatoria.
        </small>

        <small class="error" *ngIf="isInvalid('password', 'minlength')">
          La contraseña debe tener al menos 6 caracteres.
        </small>
      </div>

      <button class="btn login__button" type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="login__hint">Usuario de prueba: emilys / emilyspass</p>
  </div>
</div>
